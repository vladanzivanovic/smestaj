    - { resource: services.yml }
    - { resource: template.yml }
    - { resource: "@AdminBundle/Resources/config/services.yml" }
    - { resource: "@SiteBundle/Resources/config/services.yml" }
    - { resource: "@SiteBundle/Resources/config/validator.yml" }
    - { resource: "@SiteBundle/Resources/config/extension_services.yml" }
#    - { resource: assets_rewrite.yml }
    - { resource: security.yml }
    - { resource: mysql.yml }
    - { resource: about_us.yml }
    - { resource: liip_params.yml }
#    - { resource: maker.yml }
    - { resource: doctrine_extension.yml }
#    - { resource: social.yml }
    - { resource: "@SiteBundle/Resources/config/listeners.yml" }
