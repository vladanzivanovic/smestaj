# Put parameters here that don't need to change on each machine where the app is deployed
# http://symfony.com/doc/current/best_practices/configuration.html#application-related-configuration
parameters:
    locale: 'rs'
    limit:
        index_payed: 10
        adsPerPage: 12
    image:
        max_image_upload: 10
        allowed_file_types:
            - 'jpeg'
            - 'jpg'
            - 'png'
            - 'gif'
        max_file_size: 2000000
    upload_image_dir: "uploads/images/"
    upload_badges_dir: "uploads/badges/"
    upload_tmp_dir: "uploads/tmp/"
    image_resize:
        product:
          thumbnail: [400,400]
          max_resolution: [800,800]
        category:
          thumbnail: [600,300]
          max_resolution: [1920,500]
        slider:
          max_resolution: [1920,1080]

framework:
    #esi: ~
    default_locale: '%locale%'
    translator: { fallbacks: ['%locale%'] }
    secret: '%secret%'
    router:
        resource: '%kernel.project_dir%/app/config/routing.yml'
    form: ~
    csrf_protection: ~
    validation:
        email_validation_mode: html5
    serializer: ~
    property_info:
        with_constructor_extractor: true
    trusted_hosts: ~
    session:
        handler_id: null
        save_path: "%kernel.project_dir%/var/sessions/%kernel.environment%"
        cookie_samesite: lax
        cookie_secure: auto
    fragments: ~
    handle_all_throwables: true
    php_errors:
        log: true
    assets:
        json_manifest_path: '%kernel.project_dir%/web/build/manifest.json'
    mailer:
        dsn: '%env(MAILER_DSN)%'

# Twig Configuration
twig:
    debug: '%kernel.debug%'
    strict_variables: '%kernel.debug%'

# Doctrine Configuration
doctrine:
    dbal:
        driver: pdo_mysql
        host: '%database_host%'
        port: '%database_port%'
        dbname: '%database_name%'
        user: '%database_user%'
        password: '%database_password%'
        server_version: 'mariadb-10.11.0'
        charset: UTF8
        mapping_types:
            enum: string
        default_table_options:
            charset: utf8mb4
            collation: utf8mb4_unicode_ci
        # if using pdo_sqlite as your database driver:
        #   1. add the path in parameters.yml
        #     e.g. database_path: "%kernel.root_dir%/../var/data/data.sqlite"
        #   2. Uncomment database_path in parameters.yml.dist
        #   3. Uncomment next line:
        #path: '%database_path%'

    orm:
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            SiteBundle:
                type: attribute
                is_bundle: true

fos_js_routing:
    cache_control:
        # All are optional, defaults shown
        public: false   # can be true (public) or false (private)
        maxage: null    # integer value, e.g. 300
        smaxage: null   # integer value, e.g. 300
        expires: null   # anything that can be fed to "new \DateTime($expires)", e.g. "5 minutes"
        vary: []        # string or array, e.g. "Cookie" or [ Cookie, Accept ]
doctrine_migrations:
    migrations_paths:
        'Application\Migrations': '%kernel.project_dir%/app/DoctrineMigrations'
    storage:
        table_storage:
            table_name: migration_versions
