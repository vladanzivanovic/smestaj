imports:
    - { resource: config.yml }
    - { resource: ads.yml }
    - { resource: monolog.yaml }

framework:
    router:
        resource: '%kernel.project_dir%/app/config/routing_dev.yml'
    profiler:
        only_exceptions: false

web_profiler:
    toolbar: true
    intercept_redirects: false

# Mailer uses MAILER_DSN env var, set in docker-compose.yml for dev
# Default dev DSN points to mailcatcher: smtp://mailcatcher:1025
