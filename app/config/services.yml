# Learn more about services, parameters and containers at
# http://symfony.com/doc/current/book/service_container.html
parameters:
#    parameter_name: value

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false
        bind:
            $uploadAdsDir: '%upload_image_dir%'
            $tmpDir: '%upload_tmp_dir%'
            $fileTypes: '%file_types%'
            $languages: '%languages%'
            $logDir: '%kernel.logs_dir%'

    Doctrine\Persistence\ObjectManager:
        alias: 'doctrine.orm.default_entity_manager'

    SiteBundle\:
        resource: '../../src/SiteBundle/*'
        exclude: '../../src/SiteBundle/{DependencyInjection,Entity,Migrations,Tests,Resources}'
    AdminBundle\:
        resource: '../../src/AdminBundle/*'
        exclude: '../../src/AdminBundle/{DependencyInjection,Entity,Migrations,Tests,Resources}'

    AdminBundle\Parser\ProductEditRequestParser: ~

    AdminBundle\Parser\RequestParserInterface $productEditRequestParser: '@AdminBundle\Parser\ProductEditRequestParser'

    Liip\ImagineBundle\Service\FilterService:
        alias: 'liip_imagine.service.filter'

    Twig\Extra\Intl\IntlExtension:
        tags:
            - { name: twig.extension }

    SiteBundle\EventListeners\SiteMapAdsSubscriber:
        tags:
            - { name: "kernel.event_subscriber", priority: 100 }

    app.base_service:
        class: SiteBundle\Services\ServiceContainer
        abstract: true
        arguments:
          - '@doctrine.orm.entity_manager'
          - '@security.token_storage'

    app.auth_failure_listener:
        class: SiteBundle\EventListeners\LoginListener
        arguments:
            - "@security.token_storage"
        tags:
            - { name: kernel.event_listener, event: Symfony\Component\Security\Http\Event\LoginFailureEvent, method: onAuthenticationFailure }

    app.auth_success_listener:
        class: SiteBundle\EventListeners\LoginListener
        arguments:
            - "@security.token_storage"
        tags:
            - { name: kernel.event_listener, event: Symfony\Component\Security\Http\Event\LoginSuccessEvent, method: onAuthenticationSuccess }

    app.array_helper:
        class: SiteBundle\Helper\ArrayHelper
        arguments:
            - '@jms_serializer'

    app.app_helper:
        class: SiteBundle\Helper\AppHelper
        arguments:
            - '@request_stack'
            - '%kernel.environment%'
            - '%assetic_base_path%'

    app.text_helper:
        class: SiteBundle\Helper\TextHelper
    app.constants_helper:
        class: SiteBundle\Helper\ConstantsHelper
    app.finder_service:
        class: Symfony\Component\Finder\Finder
        public: false
    app.asset_remove_version:
        class: SiteBundle\Asset\RemoveVersionStrategy
    gedmo.listener.timestampable:
        class: Gedmo\Timestampable\TimestampableListener
        tags:
            - { name: doctrine.event_listener, event: prePersist }
            - { name: doctrine.event_listener, event: onFlush }
            - { name: doctrine.event_listener, event: loadClassMetadata }
    gedmo.listener.sluggable:
        class: Gedmo\Sluggable\SluggableListener
        tags:
            - { name: doctrine.event_listener, event: prePersist }
            - { name: doctrine.event_listener, event: onFlush }
            - { name: doctrine.event_listener, event: loadClassMetadata }
    # NOTE: Gedmo\SoftDeleteable\SoftDeleteableListener::getSubscribedEvents()
    # returns ['loadClassMetadata', 'onFlush', 'postFlush'] — it does NOT
    # subscribe to prePersist. Do NOT copy the 3-tag template from
    # gedmo.listener.timestampable / gedmo.listener.sluggable above onto this
    # service: tagging prePersist here triggers MissingEventSubscriber on boot
    # because the listener has no prePersist handler. postFlush is also left
    # unwired on purpose — no postSoftDelete subscribers exist in this app and
    # SoftDeleteableListener::__construct(bool $handlePostFlushEvent = false)
    # short-circuits the postFlush path by default.
    gedmo.listener.softdeleteable:
        class: Gedmo\SoftDeleteable\SoftDeleteableListener
        tags:
            - { name: doctrine.event_listener, event: onFlush }
            - { name: doctrine.event_listener, event: loadClassMetadata }
