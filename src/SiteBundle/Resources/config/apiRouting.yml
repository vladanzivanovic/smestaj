site_api_ads_view:
  path: /ads-list/{category}/{extraParams}
  controller: SiteBundle\Controller\Api\Ads\AdsIndexController::indexAction
  defaults:
    extraParams: null
    requirements:
      extraParams: .*
    methods: [ GET ]

