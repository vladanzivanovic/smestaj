site_user_update:
  path: /user/{id}
  defaults: { _controller: SiteBundle\Controller\Api\User\UserEditController::updateUserAction }
  methods: [PUT]
  requirements:
      id: '\d+'

site_ad_reservation_days:
  path: /ad-reserved-days/{dateTime}/{adsId}
  defaults: { _controller: SiteBundle\Controller\Reservation\ReservationGetController::getReservationForAdAction }
  methods: [GET]
  requirements:
    adsId: '\d+'

site_ads_id:
  path: /product/{id}
  defaults: { _controller: SiteBundle\Controller\Ads\AdsGetController::getAdsByIdAction }
